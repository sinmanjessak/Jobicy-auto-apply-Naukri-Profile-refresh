[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naukri-automation-starter"
version = "0.1.0"
description = "Local-first Naukri job search automation starter"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.50,<2",
  "python-dotenv>=1.0,<2",
  "APScheduler>=3.10,<4",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "pypdf>=5,<7",
  "tzdata>=2024.1",
]

[project.scripts]
naukri-auto = "naukri_automation.cli:app"

[tool.setuptools.packages.find]
include = ["naukri_automation*"]
